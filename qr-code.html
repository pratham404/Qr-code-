<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGT Biotechnologies - QR-code</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html,body{min-height:100%;background:#eef2ef}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:3px solid #0b6b2d;border-radius:24px;padding:24px;max-width:500px;width:100%;text-align:center}
.card h1{color:#0b6b2d;font-size:30px;margin-bottom:16px}
.card p{color:#333;font-size:18px;line-height:1.6;margin-bottom:20px}
.card img{width:100%;max-width:320px;height:auto;border:2px solid #d8e8dc;border-radius:18px}
.card a{display:inline-block;margin-top:20px;padding:12px 22px;background:#18a64b;color:#fff;border-radius:999px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>QR-code</h1>
<p>Scan this QR code for the product page.</p>
<img id="qrImage" src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=https://pratham404.github.io/Qr-code-/legend-poshak-500ml.html" alt="Product QR-code">
<a id="backLink" href="legend-poshak-500ml.html">Back to product</a>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const productUrl = params.get('url') || 'https://pratham404.github.io/Qr-code-/legend-poshak-500ml.html';
const qrImage = document.getElementById('qrImage');
const backLink = document.getElementById('backLink');
if (qrImage) {
  qrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=' + encodeURIComponent(productUrl);
  qrImage.alt = 'Product QR-code';
}
if (backLink) {
  backLink.href = productUrl;
}
</script>
</body>
</html>
